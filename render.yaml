# Бэкенд + Postgres на Render (Blueprint).
# Dashboard → New → Blueprint → выбрать репозиторий. Секреты с sync:false
# Render спросит при создании. Фронтенд остаётся на Vercel (статика из корня).
services:
  - type: web
    name: bpm-platform-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bpm-platform-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Адрес фронтенда на Vercel — для ссылок в письмах
      - key: FRONTEND_BASE_URL
        sync: false
      # Дополнительные origin помимо *.vercel.app/*.netlify.app (свой домен)
      - key: CORS_ORIGINS
        sync: false
      # SMTP: пока не заполнен — ссылки подтверждения/сброса работают в dev-режиме
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # mock — пока нет мерчант-аккаунта Kaspi; сменить на kaspi после онбординга
      - key: PAYMENT_PROVIDER
        value: mock
      - key: ADMIN_COOKIE_SECURE
        value: "true"

databases:
  - name: bpm-platform-db
    plan: free
